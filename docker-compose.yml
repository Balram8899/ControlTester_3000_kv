version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - NVIDIA_VISIBLE_DEVICES=all        # Enable GPU visibility
      - OLLAMA_KEEP_ALIVE=24h             # Keep models loaded
      - OLLAMA_MAX_LOADED_MODELS=1        # Memory management      
      - OLLAMA_NO_CPU_FALLBACK=1          # Disable CPU fallback
      - OLLAMA_CONTEXT_LENGTH=4096
      - NVIDIA_DRIVER_CAPABILITIES=all    # ← ADD: enables compute,video,display,utility
      - CUDA_VISIBLE_DEVICES=0            # ← ADD: explicit CUDA device binding
      - OLLAMA_NUM_GPU=999                # ← CHANGE from 1: lets Ollama use all GPU layers
      - OLLAMA_NUM_PARALLEL=4             # ← CHANGE from 1: allow parallel requests
    networks:
      - appnet
    volumes:
      - ollama_data:/root/.ollama
    deploy:                               # 🚀 GPU ACCELERATION CONFIGURATION
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]           # 👈 PIN TO RTX 3060
              capabilities: [gpu]         # Request GPU capabilities
    
    runtime: nvidia
    
    # Improved healthcheck with longer startup time for GPU initialization
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s                    # Increased for GPU initialization

  streamlit_app:
    build: .
    container_name: streamlit_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      ollama:
        condition: service_healthy     
    networks:
      - appnet
    volumes:
      - ./workbooks:/app/workbooks         # For PDF files
      - ./temp_files:/app/temp_files       # For temporary files
    
    # Resource limits for WSL2 optimization
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 512m
          cpus: '0.5'
  
  fastapi_api:
    build:
      context: .                    # must be root of repo
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      
    networks:
      - appnet


  web_ui_agent:
    build:
      context: ./kpmg_ui
      dockerfile: Dockerfile
    container_name: agent_assess_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-http://fastapi_api:8000}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_NUM_CTX=6144
    depends_on:
      fastapi_api:
        condition: service_started
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.5'


volumes:
  ollama_data:
    driver: local

networks:
  appnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ollama-bridge
