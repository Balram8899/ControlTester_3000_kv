version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - appnet
    volumes:
      - mongodb_data:/data/db

  fastapi_api:
    build:
      context: .                    # must be root of repo
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_LLM_MODEL=${GOOGLE_LLM_MODEL:-gemini-3-flash-preview}
      - GOOGLE_EMBEDDING_MODEL=${GOOGLE_EMBEDDING_MODEL:-models/text-embedding-004}
      - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - appnet

  web_ui_agent:
    build:
      context: ./kpmg_ui
      dockerfile: Dockerfile
    container_name: agent_assess_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-http://fastapi_api:8000}
    depends_on:
      fastapi_api:
        condition: service_started
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.5'


volumes:
  mongodb_data:
    driver: local

networks:
  appnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: app-bridge
