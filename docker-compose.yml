services:
  mongodb:
    image: mongo:7
    container_name: mongodb_Trace_KV
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - appnet
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis_Trace_KV
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  fastapi_api:
    build:
      context: .                    # must be root of repo
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_LLM_MODEL=${GOOGLE_LLM_MODEL:-gemini-3-flash-preview}
      - GOOGLE_EMBEDDING_MODEL=${GOOGLE_EMBEDDING_MODEL:-models/text-embedding-004}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-llama3:latest}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL:-gpt-5.5}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      - KIMI_LLM_MODEL=${KIMI_LLM_MODEL:-kimi-k2.6}
      - KIMI_TEMPERATURE=${KIMI_TEMPERATURE:-0.2}
      - KIMI_THINKING=${KIMI_THINKING:-disabled}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_LLM_MODEL=${DEEPSEEK_LLM_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_TEMPERATURE=${DEEPSEEK_TEMPERATURE:-0.2}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-enabled}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-high}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_LLM_MODEL=${ANTHROPIC_LLM_MODEL:-claude-opus-4-7}
      - MONGO_URI=mongodb://mongodb:27017
      - DOCUMENT_UPLIFT_ENABLED=${DOCUMENT_UPLIFT_ENABLED:-true}
      - TASK_BACKEND=${TASK_BACKEND:-asyncio}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - DOCUMENT_UPLIFT_ASYNC_WORKERS=${DOCUMENT_UPLIFT_ASYNC_WORKERS:-2}
      - DOCUMENT_UPLIFT_QUEUE_MAXSIZE=${DOCUMENT_UPLIFT_QUEUE_MAXSIZE:-20}
      - DOCUMENT_UPLIFT_PIPELINE_TIMEOUT_SECONDS=${DOCUMENT_UPLIFT_PIPELINE_TIMEOUT_SECONDS:-3600}
      - DOCUMENT_UPLIFT_STAGE2_REWRITE_LIMIT=${DOCUMENT_UPLIFT_STAGE2_REWRITE_LIMIT:-50}
      - SOP_UPLIFT_DEFAULT_BATCH_SIZE=${SOP_UPLIFT_DEFAULT_BATCH_SIZE:-5}
      - SOP_UPLIFT_MAX_CHUNK_CHARS=${SOP_UPLIFT_MAX_CHUNK_CHARS:-4000}
      - SOP_UPLIFT_MAX_CHUNKS_PER_CASE=${SOP_UPLIFT_MAX_CHUNKS_PER_CASE:-200}
      - SOP_UPLIFT_DOCUMENT_LLM_WORKERS=${SOP_UPLIFT_DOCUMENT_LLM_WORKERS:-3}
      - SOP_UPLIFT_MAX_ANCHORS_PER_PROMPT=${SOP_UPLIFT_MAX_ANCHORS_PER_PROMPT:-40}
      - SOP_UPLIFT_ANCHOR_EXCERPT_CHARS=${SOP_UPLIFT_ANCHOR_EXCERPT_CHARS:-160}
      - SOP_UPLIFT_ANCHOR_TEXT_BUDGET_CHARS=${SOP_UPLIFT_ANCHOR_TEXT_BUDGET_CHARS:-3000}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery_worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: celery_worker_Trace_KV
    restart: unless-stopped
    command:
      - celery
      - -A
      - utils.sop_processing.celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - document_uplift,conversion,chunking,excel,llm,analysis,outputs
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_LLM_MODEL=${GOOGLE_LLM_MODEL:-gemini-3-flash-preview}
      - GOOGLE_EMBEDDING_MODEL=${GOOGLE_EMBEDDING_MODEL:-models/text-embedding-004}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-llama3:latest}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL:-gpt-5.5}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      - KIMI_LLM_MODEL=${KIMI_LLM_MODEL:-kimi-k2.6}
      - KIMI_TEMPERATURE=${KIMI_TEMPERATURE:-0.2}
      - KIMI_THINKING=${KIMI_THINKING:-disabled}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_LLM_MODEL=${DEEPSEEK_LLM_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_TEMPERATURE=${DEEPSEEK_TEMPERATURE:-0.2}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-enabled}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-high}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_LLM_MODEL=${ANTHROPIC_LLM_MODEL:-claude-opus-4-7}
      - MONGO_URI=mongodb://mongodb:27017
      - DOCUMENT_UPLIFT_ENABLED=${DOCUMENT_UPLIFT_ENABLED:-true}
      - TASK_BACKEND=celery
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - DOCUMENT_UPLIFT_STAGE2_REWRITE_LIMIT=${DOCUMENT_UPLIFT_STAGE2_REWRITE_LIMIT:-50}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - appnet

  ct_worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ct_worker_Trace_KV
    restart: unless-stopped
    command:
      - celery
      - -A
      - utils.control_assurance.celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - ct_pipeline
      - --concurrency=2
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_LLM_MODEL=${GOOGLE_LLM_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL}
      - KIMI_LLM_MODEL=${KIMI_LLM_MODEL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_LLM_MODEL=${DEEPSEEK_LLM_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_LLM_MODEL=${ANTHROPIC_LLM_MODEL}
      - MONGO_URI=mongodb://mongodb:27017
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - appnet

  web_ui_agent:
    build:
      context: ./kpmg_ui
      dockerfile: Dockerfile
    container_name: agent_assess_web_Trace_KV
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-http://fastapi_api:8000}
    depends_on:
      fastapi_api:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/login > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.5'


volumes:
  mongodb_data:
    driver: local

networks:
  appnet:
    driver: bridge
