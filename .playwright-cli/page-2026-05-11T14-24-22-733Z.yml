                      - paragraph [ref=e329]
                      - paragraph [ref=e330]: 1. Purpose
                      - paragraph [ref=e331]:
                        - generic [ref=e332]: This Standard Operating Procedure (SOP) defines the process for collecting, monitoring, reporting, and managing deviations in Environmental, Social, and Governance (ESG) data and metrics at the bank.
                      - paragraph [ref=e333]: The objective is to ensure that ESG information reported internally and externally is accurate, complete, and consistent, and that material deviations from targets are identified and managed in a timely manner.
                      - paragraph [ref=e334]
                      - paragraph [ref=e335]: 2. Scope
                      - paragraph [ref=e336]:
                        - generic [ref=e337]: "This SOP applies to all ESG data collected and reported by the bank, covering Environmental, Social, and Governance metrics. It is applicable to:"
                      - paragraph [ref=e338]: • The corporate sustainability / ESG team
                      - paragraph [ref=e339]: • Finance, HR, Facilities, IT, and other functions that contribute ESG data
                      - paragraph [ref=e340]: • Internal reporting to senior management and the board
                      - paragraph [ref=e341]: • External reporting including the annual BRSR disclosure and sustainability report
                      - paragraph [ref=e342]:
                        - generic [ref=e343]: This SOP covers direct operations of the bank. It does not cover financed emissions in detail.
                      - paragraph [ref=e344]
