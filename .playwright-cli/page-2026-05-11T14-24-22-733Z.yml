                            - paragraph [ref=e507]: Action
                          - cell "Details" [ref=e508]:
                            - paragraph [ref=e509]: Details
                        - row "1 Identify Deviation During data collection or reporting, identify any metrics that are significantly different from the target or prior period. Use judgement to determine significance." [ref=e510]:
