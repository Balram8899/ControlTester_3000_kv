                      - paragraph [ref=e463]
                      - paragraph [ref=e464]: 4. Data Collection Process
                      - paragraph [ref=e465]: 4.1 Roles and Responsibilities for Data Collection
                      - paragraph [ref=e466]:
                        - generic [ref=e467]: ESG data collection is the responsibility of the relevant teams across the organisation. Each team should provide accurate data to the ESG team on a timely basis.
                      - paragraph [ref=e468]
                      - paragraph [ref=e469]: 4.2 Data Collection Steps
                      - paragraph [ref=e470]:
                        - generic [ref=e471]: "The ESG team will coordinate the collection of data from across the organisation using the following process:"
                      - paragraph [ref=e472]:
                        - text: •
                        - generic [ref=e473]: At the start of each reporting period, the ESG team will reach out to relevant teams to request data
                      - paragraph [ref=e474]:
                        - text: •
                        - generic [ref=e475]: Teams should provide data in the agreed format and by the agreed deadline
                      - paragraph [ref=e476]:
                        - text: •
                        - generic [ref=e477]: The ESG team will consolidate the data into the ESG reporting template
                      - paragraph [ref=e478]:
                        - text: •
                        - generic [ref=e479]: Any missing or incomplete data should be flagged and followed up with the relevant team
                      - paragraph [ref=e480]
                      - paragraph [ref=e481]: 4.3 Scope of Emissions Reporting
                      - paragraph [ref=e482]:
                        - generic [ref=e483]: The bank reports Scope 1 and Scope 2 greenhouse gas (GHG) emissions in accordance with applicable reporting requirements.
                      - paragraph [ref=e484]: • Scope 1 emissions include direct emissions from diesel generators, company-owned fleet, and air conditioning refrigerants
                      - paragraph [ref=e485]: • Scope 2 emissions include indirect emissions from purchased electricity, reported on a market-based basis
                      - paragraph [ref=e486]: • Scope 3 emissions are reported for selected categories where data is available
                      - paragraph [ref=e487]
                      - paragraph [ref=e488]: 5. Deviation Identification and Management
                      - paragraph [ref=e489]:
                        - generic [ref=e490]: When ESG metrics deviate from their targets, the bank needs to identify the deviation, understand the root cause, and take corrective action where required.
                      - paragraph [ref=e491]: 5.1 What Constitutes a Deviation
                      - paragraph [ref=e492]:
                        - generic [ref=e493]: A deviation occurs when a reported ESG metric is significantly different from the target or the prior year figure. The ESG team, in consultation with the relevant business unit, will determine whether a deviation is material and requires escalation.
                      - paragraph [ref=e494]
                      - paragraph [ref=e495]: 5.2 Deviation Management Process
                      - paragraph [ref=e496]: "When a deviation is identified, the following steps should be followed:"
                      - paragraph [ref=e497]
                      - table [ref=e498]:
                        - row "Step Action Details" [ref=e503]:
                          - cell "Step" [ref=e504]:
                            - paragraph [ref=e505]: Step
