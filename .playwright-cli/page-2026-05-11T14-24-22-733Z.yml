                      - paragraph [ref=e550]
                      - paragraph [ref=e551]: 6. Reporting
                      - paragraph [ref=e552]: 6.1 Internal Reporting
                      - paragraph [ref=e553]:
                        - generic [ref=e554]: "ESG performance data is reported internally to the senior management team and the board on a periodic basis. Reports should include:"
                      - paragraph [ref=e555]: • Key ESG metrics and performance against targets
                      - paragraph [ref=e556]: • Any significant deviations or issues identified during the period
                      - paragraph [ref=e557]: • Progress on ESG initiatives and programmes
                      - paragraph [ref=e558]
                      - paragraph [ref=e559]: 6.2 External Reporting
                      - paragraph [ref=e560]:
                        - generic [ref=e561]: The bank discloses ESG information externally in its annual report, including the BRSR submission. External reporting should be accurate and consistent with internal records.
                      - paragraph [ref=e562]:
                        - generic [ref=e563]: Before submission, external reports should be reviewed by the CFO and approved by senior management.
                      - paragraph [ref=e564]
                      - paragraph [ref=e565]: 6.3 Regulatory Reporting Triggers
                      - paragraph [ref=e566]:
                        - generic [ref=e567]: Where ESG-related regulatory requirements exist, the bank should comply with applicable timelines. The ESG team should liaise with Compliance to ensure regulatory obligations are met.
                      - paragraph [ref=e568]
