                      - paragraph [ref=e401]
                      - paragraph [ref=e402]: 1. Purpose
                      - paragraph [ref=e403]:
                        - generic [ref=e404]: This Standard Operating Procedure (SOP) defines the process for collecting, monitoring, reporting, and managing deviations in Environmental, Social, and Governance (ESG) data and metrics at the bank.
                      - paragraph [ref=e405]: The objective is to ensure that ESG information reported internally and externally is accurate, complete, and consistent, and that material deviations from targets are identified and managed in a timely manner.
                      - paragraph [ref=e406]
                      - paragraph [ref=e407]: 2. Scope
                      - paragraph [ref=e408]:
                        - generic [ref=e409]: "This SOP applies to all ESG data collected and reported by the bank, covering Environmental, Social, and Governance metrics. It is applicable to:"
                      - paragraph [ref=e410]: • The corporate sustainability / ESG team
                      - paragraph [ref=e411]: • Finance, HR, Facilities, IT, and other functions that contribute ESG data
                      - paragraph [ref=e412]: • Internal reporting to senior management and the board
                      - paragraph [ref=e413]: • External reporting including the annual BRSR disclosure and sustainability report
                      - paragraph [ref=e414]: This SOP covers direct operations of the bank. It does not cover financed emissions in detail.
                      - paragraph [ref=e415]
