                              - generic [ref=e586]: During data collection or reporting, identify any metrics that are significantly different from the target or prior period. Use judgement to determine significance.
                        - row "2 Investigate Root Cause Work with the relevant team to understand why the deviation has occurred. This may be due to data quality issues, operational changes, or external factors." [ref=e587]:
                          - cell "2" [ref=e588]:
