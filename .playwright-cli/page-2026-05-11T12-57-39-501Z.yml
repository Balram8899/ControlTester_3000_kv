                      - paragraph [ref=e619]
                      - paragraph [ref=e620]: 6. Reporting
                      - paragraph [ref=e621]: 6.1 Internal Reporting
                      - paragraph [ref=e622]:
                        - generic [ref=e623]: "ESG performance data is reported internally to the senior management team and the board on a periodic basis. Reports should include:"
                      - paragraph [ref=e624]: • Key ESG metrics and performance against targets
                      - paragraph [ref=e625]: • Any significant deviations or issues identified during the period
                      - paragraph [ref=e626]: • Progress on ESG initiatives and programmes
                      - paragraph [ref=e627]
                      - paragraph [ref=e628]: 6.2 External Reporting
                      - paragraph [ref=e629]:
                        - generic [ref=e630]: The bank discloses ESG information externally in its annual report, including the BRSR submission. External reporting should be accurate and consistent with internal records.
                      - paragraph [ref=e631]:
                        - generic [ref=e632]: Before submission, external reports should be reviewed by the CFO and approved by senior management.
                      - paragraph [ref=e633]
                      - paragraph [ref=e634]: 6.3 Regulatory Reporting Triggers
                      - paragraph [ref=e635]:
                        - generic [ref=e636]: Where ESG-related regulatory requirements exist, the bank should comply with applicable timelines. The ESG team should liaise with Compliance to ensure regulatory obligations are met.
                      - paragraph [ref=e637]
