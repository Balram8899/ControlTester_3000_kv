                      - paragraph [ref=e534]
                      - paragraph [ref=e535]: 4. Data Collection Process
                      - paragraph [ref=e536]: 4.1 Roles and Responsibilities for Data Collection
                      - paragraph [ref=e537]:
                        - generic [ref=e538]: ESG data collection is the responsibility of the relevant teams across the organisation. Each team should provide accurate data to the ESG team on a timely basis.
                      - paragraph [ref=e539]
                      - paragraph [ref=e540]: 4.2 Data Collection Steps
                      - paragraph [ref=e541]:
                        - generic [ref=e542]: "The ESG team will coordinate the collection of data from across the organisation using the following process:"
                      - paragraph [ref=e543]:
                        - text: •
                        - generic [ref=e544]: At the start of each reporting period, the ESG team will reach out to relevant teams to request data
                      - paragraph [ref=e545]: • Teams should provide data in the agreed format and by the agreed deadline
                      - paragraph [ref=e546]: • The ESG team will consolidate the data into the ESG reporting template
                      - paragraph [ref=e547]:
                        - text: •
                        - generic [ref=e548]: Any missing or incomplete data should be flagged and followed up with the relevant team
                      - paragraph [ref=e549]
                      - paragraph [ref=e550]: 4.3 Scope of Emissions Reporting
                      - paragraph [ref=e551]:
                        - generic [ref=e552]: The bank reports Scope 1 and Scope 2 greenhouse gas (GHG) emissions in accordance with applicable reporting requirements.
                      - paragraph [ref=e553]: • Scope 1 emissions include direct emissions from diesel generators, company-owned fleet, and air conditioning refrigerants
                      - paragraph [ref=e554]: • Scope 2 emissions include indirect emissions from purchased electricity, reported on a market-based basis
                      - paragraph [ref=e555]: • Scope 3 emissions are reported for selected categories where data is available
                      - paragraph [ref=e556]
                      - paragraph [ref=e557]: 5. Deviation Identification and Management
                      - paragraph [ref=e558]:
                        - generic [ref=e559]: When ESG metrics deviate from their targets, the bank needs to identify the deviation, understand the root cause, and take corrective action where required.
                      - paragraph [ref=e560]: 5.1 What Constitutes a Deviation
                      - paragraph [ref=e561]:
                        - generic [ref=e562]: A deviation occurs when a reported ESG metric is significantly different from the target or the prior year figure. The ESG team, in consultation with the relevant business unit, will determine whether a deviation is material and requires escalation.
                      - paragraph [ref=e563]
                      - paragraph [ref=e564]: 5.2 Deviation Management Process
                      - paragraph [ref=e565]: "When a deviation is identified, the following steps should be followed:"
                      - paragraph [ref=e566]
                      - table [ref=e567]:
                        - row "Step Action Details" [ref=e572]:
                          - cell "Step" [ref=e573]:
                            - paragraph [ref=e574]: Step
