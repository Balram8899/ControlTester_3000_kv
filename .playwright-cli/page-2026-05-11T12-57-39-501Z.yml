                            - paragraph [ref=e576]: Action
                          - cell "Details" [ref=e577]:
                            - paragraph [ref=e578]: Details
                        - row "1 Identify Deviation During data collection or reporting, identify any metrics that are significantly different from the target or prior period. Use judgement to determine significance." [ref=e579]:
