    <text x="144" y="298" fill="#5A6478" font-family="Arial, Helvetica, sans-serif" font-size="11">Scope includes the Cloud Payments Platform, Identity Governance Portal, Vendor Onboarding Workflow, and one ad hoc utility supporting retention evidence.</text>
