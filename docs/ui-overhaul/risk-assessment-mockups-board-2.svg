    <text x="144" y="338" fill="#0C233C" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Third-Party Provisioning Delay</text>
    <text x="144" y="356" fill="#5A6478" font-family="Arial, Helvetica, sans-serif" font-size="11">Manual handoffs between approval and account activation create untracked timing gaps.</text>
