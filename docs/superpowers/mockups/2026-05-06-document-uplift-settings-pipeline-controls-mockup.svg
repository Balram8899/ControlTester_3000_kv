<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0C233C" flood-opacity="0.16"/>
    </filter>
    <style>
      .nav { font-family: Arial, sans-serif; font-size: 14px; fill: #C8D6EE; }
      .label { font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; fill: #00338D; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0C233C; }
      .cardTitle { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0C233C; }
      .body { font-family: Arial, sans-serif; font-size: 13px; fill: #5A6478; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #8492A6; }
      .heroTitle { font-family: Arial, sans-serif; font-size: 44px; font-weight: 700; fill: white; }
    </style>
  </defs>
  <rect width="1450" height="900" fill="#F0F2F7"/>
  <rect x="0" y="0" width="220" height="900" fill="#061D36"/>
  <text x="28" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">KPMG</text>
  <text x="88" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#00B8F5">TRACE</text>
  <g class="nav">
    <text x="32" y="105">Dashboard</text>
    <text x="32" y="152">Regulatory Library</text>
    <text x="32" y="199">Controls Library</text>
    <text x="32" y="246">Frameworks Library</text>
    <text x="32" y="293">Control Testing</text>
    <text x="32" y="340">Risk Assessment</text>
    <text x="32" y="387">Document Uplift</text>
    <rect x="16" y="418" width="188" height="42" rx="8" fill="#123C70"/>
    <text x="32" y="444" font-weight="700" fill="#FFFFFF">Settings</text>
  </g>
  <circle cx="38" cy="820" r="18" fill="#1E49E2"/>
  <text x="31" y="826" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">AA</text>
  <text x="68" y="817" class="nav" font-weight="700" fill="#FFFFFF">Admin Analyst</text>
  <text x="68" y="838" font-family="Arial, sans-serif" font-size="11" fill="#8FA6C8">analyst@kpmg.com</text>

  <rect x="220" y="0" width="1230" height="178" fill="#0C233C"/>
  <circle cx="1220" cy="-65" r="250" fill="#1E49E2" opacity="0.28"/>
  <circle cx="390" cy="55" r="175" fill="#7213EA" opacity="0.20"/>
  <text x="288" y="64" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#00B8F5">SETTINGS</text>
  <text x="288" y="112" class="heroTitle">Pipeline Controls</text>
  <text x="288" y="145" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.64">Tune Document Uplift processing limits before running large SOP and RCM cases.</text>

  <g filter="url(#shadow)">
    <rect x="288" y="226" width="1040" height="306" rx="16" fill="#FFFFFF" stroke="#E2E6EF"/>
    <rect x="288" y="226" width="1040" height="5" rx="2.5" fill="#7213EA"/>
    <text x="324" y="275" class="label">DOCUMENT UPLIFT</text>
    <text x="324" y="309" class="title">Pipeline Controls</text>
    <text x="324" y="340" class="body">Set the maximum number of LLM calls allowed per Document Uplift pipeline run. The cap controls Stage 1 extraction and Stage 2 output generation.</text>

    <rect x="324" y="382" width="312" height="92" rx="12" fill="#F3F0FF" stroke="#DED0FF"/>
    <text x="350" y="414" class="small" font-weight="700">MAX LLM CALLS PER PIPELINE</text>
    <text x="350" y="456" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7213EA">80</text>
    <rect x="530" y="410" width="74" height="40" rx="8" fill="#FFFFFF" stroke="#C9B4FF"/>
    <text x="552" y="436" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0C233C">Edit</text>

    <rect x="680" y="382" width="284" height="92" rx="12" fill="#EEF2FF" stroke="#C8D5FF"/>
    <text x="706" y="414" class="small" font-weight="700">RECOMMENDED LOCAL CAP</text>
    <text x="706" y="456" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E49E2">80 calls</text>
    <text x="820" y="455" class="small">Gemini Flash</text>

    <rect x="1008" y="382" width="284" height="92" rx="12" fill="#FFFBEB" stroke="#F3D978"/>
    <text x="1034" y="414" class="small" font-weight="700">BUDGET WARNING</text>
    <text x="1034" y="449" class="body">Runs stop gracefully if the cap is reached.</text>
    <text x="1034" y="469" class="small">Partial results are preserved.</text>

    <line x1="324" y1="506" x2="1292" y2="506" stroke="#E2E6EF"/>
    <rect x="324" y="544" width="170" height="48" rx="12" fill="#7213EA"/>
    <text x="377" y="574" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Save</text>
    <rect x="512" y="544" width="190" height="48" rx="12" fill="#FFFFFF" stroke="#1E49E2"/>
    <text x="552" y="574" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1E49E2">Reset to 80</text>
    <text x="732" y="573" class="small">Saved settings apply to new pipeline runs only.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="288" y="580" width="500" height="180" rx="16" fill="#FFFFFF" stroke="#E2E6EF"/>
    <rect x="288" y="580" width="500" height="5" rx="2.5" fill="#1E49E2"/>
    <text x="324" y="632" class="cardTitle">LLM Provider</text>
    <text x="324" y="663" class="body">Gemini / gemini-3-flash-preview</text>
    <rect x="324" y="694" width="132" height="38" rx="9" fill="#1E49E2"/>
    <text x="354" y="719" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Test</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="828" y="580" width="500" height="180" rx="16" fill="#FFFFFF" stroke="#E2E6EF"/>
    <rect x="828" y="580" width="500" height="5" rx="2.5" fill="#098E7E"/>
    <text x="864" y="632" class="cardTitle">Context Stores</text>
    <text x="864" y="663" class="body">General context and company policy vectorstores remain unchanged.</text>
    <rect x="864" y="694" width="166" height="34" rx="17" fill="#EDFBF5" stroke="#BEEAD7"/>
    <text x="888" y="716" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#009A44">Vectorstore Ready</text>
  </g>
</svg>
