<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0C233C" flood-opacity="0.16"/>
    </filter>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2.5px; fill: #00338D; }
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #0C233C; }
      .body { font-family: Arial, sans-serif; font-size: 15px; fill: #5A6478; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #8492A6; }
      .doc { font-family: Arial, sans-serif; font-size: 16px; fill: #0C233C; }
      .h1 { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0C233C; }
      .h2 { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0C233C; }
      .ins { font-family: Arial, sans-serif; font-size: 16px; fill: #009A44; text-decoration: underline; }
      .del { font-family: Arial, sans-serif; font-size: 16px; fill: #E5001B; text-decoration: line-through; }
    </style>
  </defs>
  <rect width="1400" height="950" fill="#F0F2F7"/>
  <rect x="0" y="0" width="1400" height="170" fill="#0C233C"/>
  <circle cx="1140" cy="-40" r="210" fill="#1E49E2" opacity="0.28"/>
  <circle cx="215" cy="70" r="170" fill="#7213EA" opacity="0.22"/>
  <text x="90" y="58" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#00B8F5">DOCUMENT UPLIFT</text>
  <text x="90" y="103" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Uplifted SOP Output Mockup</text>
  <text x="90" y="138" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.64">Track-changes Word output, generated after accepted suggestions are reviewed.</text>

  <text x="90" y="230" class="label">OUTPUT DOCUMENT</text>
  <text x="90" y="263" class="title">Track-Changes Word Export</text>
  <text x="90" y="292" class="body">The generated DOCX keeps the uploaded SOP structure and applies accepted edits as Word revisions.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="330" width="820" height="530" rx="3" fill="#FFFFFF" stroke="#D8DEEA"/>
    <rect x="90" y="330" width="820" height="54" fill="#FFFFFF" stroke="#E2E6EF"/>
    <text x="126" y="363" class="small">KYC Standard Operating Procedure</text>
    <text x="738" y="363" class="small">TRACE uplift draft</text>
    <line x1="148" y1="424" x2="852" y2="424" stroke="#E2E6EF"/>
    <text x="148" y="456" class="h1">4.2 Quarterly Access Review</text>
    <text x="148" y="494" class="doc">The Relationship Manager performs the user access review for all active KYC users.</text>
    <text x="148" y="534" class="doc">Evidence retained:</text>
    <text x="280" y="534" class="del"> screenshots of the review screen</text>
    <text x="522" y="534" class="ins"> the system access export and approval log</text>
    <text x="148" y="578" class="doc">The review is completed</text>
    <text x="348" y="578" class="del"> when practical</text>
    <text x="462" y="578" class="ins"> within ten business days after quarter-end</text>
    <text x="148" y="626" class="h2">Control Owner Clarification</text>
    <text x="148" y="666" class="doc">The Compliance Officer</text>
    <text x="330" y="666" class="ins"> reviews exceptions and documents final approval.</text>
    <line x1="148" y1="724" x2="852" y2="724" stroke="#E2E6EF"/>
    <text x="148" y="758" class="small">Footer and page margins inherit from the uploaded procedure StyleProfile.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="330" width="350" height="530" rx="16" fill="#FFFFFF" stroke="#E2E6EF"/>
    <rect x="960" y="330" width="350" height="5" rx="2.5" fill="#1E49E2"/>
    <text x="990" y="376" class="label">REVIEW SUMMARY</text>
    <text x="990" y="414" class="title" font-size="23">Changes Applied</text>
    <rect x="990" y="452" width="290" height="62" rx="10" fill="#EDFBF5" stroke="#BEEAD7"/>
    <text x="1014" y="488" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#009A44">8</text>
    <text x="1062" y="482" class="body">accepted suggestions</text>
    <rect x="990" y="534" width="290" height="62" rx="10" fill="#F3F0FF" stroke="#DED0FF"/>
    <text x="1014" y="570" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7213EA">3</text>
    <text x="1062" y="564" class="body">edited suggestions</text>
    <rect x="990" y="616" width="290" height="62" rx="10" fill="#FFFBEB" stroke="#F3D978"/>
    <text x="1014" y="652" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#EAAA00">1</text>
    <text x="1062" y="646" class="body">auto-accepted warning</text>
    <line x1="990" y1="720" x2="1280" y2="720" stroke="#E2E6EF"/>
    <text x="990" y="758" class="body">Output mode</text>
    <text x="1168" y="758" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0C233C">Track changes</text>
    <text x="990" y="795" class="body">Storage</text>
    <text x="1198" y="795" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0C233C">GridFS</text>
  </g>
</svg>
